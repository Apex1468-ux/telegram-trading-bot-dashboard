workflows:
  telegram-trading-bot-apk:
    name: Telegram Trading Bot - Build & Deploy APK
    instance_type: mac_mini_m2
    max_build_duration: 120
    
    environment:
      node: 18.17.0
      groups:
        - google_play_credentials
        - codemagic_credentials
        - eas_credentials
      vars:
        EAS_BUILD_OPTS: "--platform android --local"
        PACKAGE_NAME: "com.tradingbot.monster"
    
    triggering:
      events:
        - push
        - pull_request
      branch:
        patterns:
          - pattern: main
            include: true
          - pattern: develop
            include: true
    
    scripts:
      - name: Install Node dependencies
        script: |
          npm install -g eas-cli
          npm install -g expo-cli
      
      - name: Setup mobile directory
        script: |
          cd $CM_BUILD_DIR/mobile
          npm install
          
      - name: Setup EAS authentication
        script: |
          mkdir -p ~/.local/share/Codemagic
          echo "$EAS_TOKEN" > ~/.local/share/Codemagic/token.json
      
      - name: Setup Android credentials
        script: |
          cd $CM_BUILD_DIR/mobile
          mkdir -p ~/.android
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > ~/.android/trading-bot.keystore
          mkdir -p android
          cat > android/keystore.properties << EOF
          storeFile=~/.android/trading-bot.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      
      - name: Build APK with EAS
        script: |
          cd $CM_BUILD_DIR/mobile
          eas login --username $EAS_USERNAME --password $EAS_PASSWORD --non-interactive
          eas build --platform android --local --output=$CM_BUILD_DIR/app.apk
      
      - name: Verify APK
        script: |
          if [ -f "$CM_BUILD_DIR/app.apk" ]; then
            echo "✓ APK built successfully"
            ls -lh $CM_BUILD_DIR/app.apk
          else
            echo "✗ APK not found"
            exit 1
          fi
      
      - name: Setup Google Play credentials
        script: |
          mkdir -p ~/.config/codemagic
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > ~/.config/codemagic/service-account.json
      
      - name: Deploy to Google Play Internal Testing
        script: |
          cd $CM_BUILD_DIR
          pip3 install --upgrade pip
          pip3 install google-auth-oauthlib google-auth-httplib2 google-api-python-client
          python3 << 'PYTHON_SCRIPT'
          import json
          import sys
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          
          with open('~/.config/codemagic/service-account.json'.replace('~', '/Users/builder'), 'r') as f:
              service_account_info = json.load(f)
          
          credentials = Credentials.from_service_account_info(
              service_account_info,
              scopes=['https://www.googleapis.com/auth/androidpublisher']
          )
          
          service = build('androidpublisher', 'v3', credentials=credentials)
          package_name = 'com.tradingbot.monster'
          apk_path = '/Users/builder/app.apk'
          
          edit_request = service.edits().insert(body={}, packageName=package_name)
          edit_response = edit_request.execute()
          edit_id = edit_response['id']
          
          apk_response = service.edits().apks().upload(
              editId=edit_id,
              packageName=package_name,
              media_body=MediaFileUpload(apk_path, mimetype='application/vnd.android.package-archive')
          ).execute()
          
          print(f"APK uploaded: {apk_response['versionCode']}")
          
          track_response = service.edits().tracks().update(
              editId=edit_id,
              packageName=package_name,
              track='internal',
              body={'releases': [{'name': '1.0.0', 'versionCodes': [str(apk_response['versionCode'])], 'status': 'completed'}]}
          ).execute()
          
          commit_response = service.edits().commit(
              editId=edit_id,
              packageName=package_name
          ).execute()
          
          print("✓ Successfully deployed to Google Play Internal Testing")
          PYTHON_SCRIPT
    
    artifacts:
      - $CM_BUILD_DIR/app.apk
    
    publishing:
      email:
        recipients:
          - $ADMIN_EMAIL
        notify_on_build_start: true
        notify_on_build_failure: true
        notify_on_build_completion: true
      
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: true
        success: |
          ✅ Build #$BUILD_NUMBER succeeded
          APK: $CM_BUILD_DIR/app.apk
          Deployed to Google Play Internal Testing
        failure: |
          ❌ Build #$BUILD_NUMBER failed
          Check logs for details
